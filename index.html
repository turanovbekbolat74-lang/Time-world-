
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizza App</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #fff4ed;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.app {
  width: 100%;
  max-width: 430px;
  background: white;
  border-radius: 35px;
  overflow: hidden;
  box-shadow: 0 15px 50px #00000015;
}

.hero {
  height: 300px;
  background: linear-gradient(145deg, #ffd2b9, #ffad83);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
}

.chef {
  font-size: 115px;
  margin-bottom: 5px;
}

.pizza {
  font-size: 75px;
}

.content {
  padding: 30px;
}

h1 {
  font-size: 28px;
  color: #222;
  margin-bottom: 10px;
}

.subtitle {
  color: #999;
  font-size: 14px;
  margin-bottom: 28px;
}

.field {
  display: flex;
  align-items: center;
  background: #f5f2f5;
  border: 2px solid transparent;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
}

.field:focus-within {
  border-color: #ed7652;
}

.field span {
  margin-right: 12px;
  color: #dc7658;
}

.field input {
  border: none;
  outline: none;
  background: transparent;
  width: 100%;
  font-size: 15px;
}

.toggle {
  cursor: pointer;
  border: none;
  background: none;
  font-size: 18px;
}

.options {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  margin: 18px 0;
}

.options a {
  color: #c77d62;
  text-decoration: none;
}

.remember {
  display: flex;
  align-items: center;
  gap: 7px;
}

button {
  cursor: pointer;
}

.login {
  width: 100%;
  padding: 18px;
  background: #f0522d;
  border: none;
  border-radius: 40px;
  color: white;
  font-size: 17px;
  font-weight: bold;
  box-shadow: 0 5px 12px #f0522d30;
}

.login:hover {
  background: #d94120;
}

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #aaa;
  font-size: 13px;
  margin: 28px 0;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: #eee;
}

.social {
  display: flex;
  gap: 12px;
}

.social button {
  flex: 1;
  padding: 15px 8px;
  border: none;
  border-radius: 14px;
  background: #f5f2f5;
  font-weight: bold;
  font-size: 15px;
}

.signup {
  text-align: center;
  margin-top: 28px;
  font-size: 13px;
  color: #888;
}

.signup a {
  color: #222;
  font-weight: bold;
  text-decoration: none;
}

.guest {
  display: block;
  text-align: center;
  margin-top: 25px;
  color: #c77d62;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
}

@media (max-width: 480px) {
  body {
    padding: 0;
    background: white;
  }

  .app {
    border-radius: 0;
    min-height: 100vh;
    box-shadow: none;
  }

  .hero {
    height: 280px;
  }

  .content {
    padding: 25px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="hero">
    <div class="chef">👨🏻‍🍳</div>
    <div class="pizza">🍕</div>
  </div>

  <div class="content">

    <h1>Welcome Back</h1>
    <p class="subtitle">
      Sign in and pick up where you left off.
    </p>

    <form id="loginForm">

      <div class="field">
        <span>✉️</span>
        <input
          type="email"
          id="email"
          placeholder="Email address"
          required
        >
      </div>

      <div class="field">
        <span>🔒</span>
        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >
        <button
          type="button"
          class="toggle"
          onclick="togglePassword()"
        >👁</button>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" checked>
          Keep me signed in
        </label>

        <a href="#" onclick="forgotPassword()">
          Forgot Password?
        </a>
      </div>

      <button type="submit" class="login">
        Log In
      </button>

    </form>

    <div class="divider">Or continue with</div>

    <div class="social">
      <button onclick="socialLogin('Google')">
        🌐 Google
      </button>

      <button onclick="socialLogin('Apple')">
         Apple
      </button>
    </div>

    <div class="signup">
      Don't have an account?
      <a href="#" onclick="signUp()">Sign Up</a>
    </div>

    <a href="#" class="guest" onclick="guestLogin()">
      Browse as Guest →
    </a>

  </div>
</div>

<script>
function togglePassword() {
  const password = document.getElementById("password");

  password.type =
    password.type === "password"
      ? "text"
      : "password";
}

document.getElementById("loginForm")
.addEventListener("submit", function(e) {
  e.preventDefault();

  alert("Welcome to Pizza App!");
});

function forgotPassword() {
  alert("Password recovery will be available soon!");
}

function signUp() {
  alert("Registration page is coming soon!");
}

function guestLogin() {
  alert("Welcome! You are browsing as a guest.");
}

function socialLogin(provider) {
  alert(provider + " login will be connected soon!");
}
</script>

</body>
</html>
